services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veya
      POSTGRES_USER: veya
      POSTGRES_PASSWORD: veya
    ports:
      - "5432:5432"
    volumes:
      - veya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veya -d veya"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://veya:veya@db:5432/veya
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  veya_postgres_data:
