name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest -q

      - name: Validate operations scripts
        working-directory: ..
        run: |
          sh -n scripts/backup_postgres.sh
          sh -n scripts/verify_postgres_backup.sh
          sh -n scripts/restore_postgres.sh
          python scripts/generate_secrets.py > /tmp/veya-generated-secrets
          grep '^JWT_SECRET_KEY=' /tmp/veya-generated-secrets
          grep '^INSTAGRAM_TOKEN_ENCRYPTION_KEY=' /tmp/veya-generated-secrets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build containers
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Check frontend
        run: curl --fail http://localhost:5173

      - name: Check PostgreSQL
        run: docker compose exec -T db pg_isready -U veya -d veya

      - name: Check Redis
        run: docker compose exec -T redis redis-cli ping | grep PONG

      - name: Check worker
        run: docker compose ps --status running worker | grep worker

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v


  production-docker:
    name: Production Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    env:
      POSTGRES_DB: veya
      POSTGRES_USER: veya
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET_KEY: ci-jwt-secret-key-that-is-definitely-longer-than-32-bytes
      FRONTEND_APP_URL: https://app.example.com
      MAIL_PROVIDER: resend
      RESEND_API_KEY: ci-resend-key
      MAIL_FROM: Veya <noreply@example.com>
      INSTAGRAM_CLIENT_ID: ci-instagram-client
      INSTAGRAM_CLIENT_SECRET: ci-instagram-secret
      INSTAGRAM_REDIRECT_URI: https://api.example.com/api/integrations/instagram/callback
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ci-encryption-key
      OPENAI_API_KEY: ""
      HTTP_PORT: "8080"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose
        run: docker compose -f docker-compose.production.yml config

      - name: Build production containers
        run: docker compose -f docker-compose.production.yml build

      - name: Start production stack
        run: docker compose -f docker-compose.production.yml up -d

      - name: Wait for backend readiness
        run: |
          for i in {1..40}; do
            if docker compose -f docker-compose.production.yml exec -T backend               python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"               >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml logs
          exit 1

      - name: Check production frontend
        run: |
          curl --fail --silent http://localhost:8080/ >/dev/null
          curl --fail --silent --head http://localhost:8080/ | grep -i "server: nginx"

      - name: Check migration completed
        run: docker compose -f docker-compose.production.yml ps -a migrate

      - name: Check production worker
        run: docker compose -f docker-compose.production.yml ps --status running worker | grep worker

      - name: Create and verify PostgreSQL backup
        run: |
          BACKUP_DIR=/tmp/veya-backups sh scripts/backup_postgres.sh
          BACKUP_FILE="$(ls -1 /tmp/veya-backups/*.dump | head -n 1)"
          sh scripts/verify_postgres_backup.sh "$BACKUP_FILE"

      - name: Show production logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down -v
