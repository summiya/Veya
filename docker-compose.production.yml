services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veya}
      POSTGRES_USER: ${POSTGRES_USER:-veya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - veya_production_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-veya} -d ${POSTGRES_DB:-veya}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - veya_production_redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_ALERT_COOLDOWN_SECONDS: ${SENTRY_ALERT_COOLDOWN_SECONDS:-300}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_SIGNUP_PER_HOUR: ${RATE_LIMIT_SIGNUP_PER_HOUR:-20}
      RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR: ${RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR:-5}
      RATE_LIMIT_RESET_PASSWORD_PER_HOUR: ${RATE_LIMIT_RESET_PASSWORD_PER_HOUR:-10}
      RATE_LIMIT_REFRESH_PER_MINUTE: ${RATE_LIMIT_REFRESH_PER_MINUTE:-60}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-veya}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:?FRONTEND_APP_URL is required}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:?INSTAGRAM_CLIENT_ID is required}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:?INSTAGRAM_CLIENT_SECRET is required}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:?INSTAGRAM_REDIRECT_URI is required}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY:?INSTAGRAM_TOKEN_ENCRYPTION_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["arq", "veya.infrastructure.jobs.worker.WorkerSettings"]
    restart: unless-stopped
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.05}
        VITE_ENVIRONMENT: production
        VITE_RELEASE: ${VITE_RELEASE:-0.1.0}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  veya_production_postgres:
  veya_production_redis:
